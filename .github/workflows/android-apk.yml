name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable debug APK
        working-directory: android
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: ${{ github.event.release.tag_name || '0.1.0' }}
        run: ./gradlew -PversionCode="$APK_VERSION_CODE" -PversionName="$APK_VERSION_NAME" assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nou-scripts-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  attach-release-apk:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nou-scripts-android-${{ github.sha }}
          path: dist
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mv dist/app-debug.apk "dist/nou-scripts-android-${TAG}.apk"
          gh release upload "$TAG" "dist/nou-scripts-android-${TAG}.apk" --clobber
